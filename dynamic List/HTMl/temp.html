<!DOCTYPE html>
<html>
<head>
  
    <title>Goku Animation Effect</title>
    <style>
      
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('goku.jpg') no-repeat center center; 
            background-size: cover;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-box {
            width: 150px;
            height: 380px;
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            z-index: 5; 
        }

        .moving-goku {
            position: fixed; 
            width: 150px;
            height: 380px; 
            object-fit: cover; 
            border-radius: 8px; 
            z-index: 10; 
            animation: moveAndRotate 10s infinite linear; 
        }

      
        @keyframes moveAndRotate {
          
            0% {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
          
            20% {
                top: 220px; 
                left: 95px; 
                transform: translate(-50%, -50%);
            }
         
            40% {
                top: 220px;
                left: calc(100% - 95px); 
                transform: translate(-50%, -50%);
            }
          
            60% {
                top: calc(100% - 220px);
                left: calc(100% - 95px);
                transform: translate(-50%, -50%);
            }
          
            80% {
                top: calc(100% - 220px);
                left: 95px;
                transform: translate(-50%, -50%);
            }
         
            100% {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        }
    </style>
</head>
<body>

    <!-- Black Div -->
    <div class="center-box"></div>

    <!-- Goku Image (Div ke bahar hai par center me perfectly fit hogi) -->
    <img src="gokuOnly.jpg" alt="Goku" class="moving-goku">

</body>
</html>
